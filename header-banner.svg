<svg width="100%" height="160" viewBox="0 0 900 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#121720"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0057FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0057FF" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="160" rx="12" fill="url(#bgGrad)"/>
  <rect width="900" height="160" rx="12" fill="url(#grid)" opacity="0.6"/>
  <rect width="900" height="160" rx="12" stroke="#161B22" stroke-width="2"/>

  <!-- Top Blue Accent Line -->
  <path d="M 12 2 L 888 2" stroke="url(#blueGlow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Status Indicator -->
  <circle cx="50" cy="80" r="14" fill="#161B22" stroke="#0057FF" stroke-width="2"/>
  <circle cx="50" cy="80" r="6" fill="#0057FF"/>

  <!-- Name & Typography -->
  <text x="85" y="72" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1.2">
    MIGUEL CAMPIÃO ARRAES
  </text>
  
  <text x="85" y="104" fill="#0057FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">
    DESENVOLVIMENTO DE SISTEMAS &amp; ENGENHARIA DE SOFTWARE
  </text>
  
  <text x="85" y="126" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">
    Foco em Backend, APIs RESTful, Modelagem de Bancos de Dados e Arquitetura Java
  </text>

  <!-- Right Decorative Tech Badge -->
  <g transform="translate(690, 48)">
    <rect width="160" height="64" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="80" y="28" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">
      ECOSSISTEMA PRINCIPAL
    </text>
    <text x="80" y="48" text-anchor="middle" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">
      Java 17 • Spring • SQL
    </text>
  </g>
</svg>
